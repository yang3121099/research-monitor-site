<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; script-src 'self' 'sha256-jXOh333VVN2w4Wgn8mSuv04y92vrqgIJlJX9hYR/FTo='; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://hf.co https://*.hf.co; img-src 'self' data: https://huggingface.co https://*.huggingface.co; frame-src 'self' blob:; worker-src 'none'; manifest-src 'none'">
  <title>研究监控 · 加密访问</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./unlock.js" defer></script>
</head>
<body>
  <main id="gate" class="gate">
    <section class="access-card" aria-labelledby="access-title">
      <div class="brand-mark" aria-hidden="true">◈</div>
      <p class="eyebrow">RESEARCH MONITOR</p>
      <h1 id="access-title">研究进展，安全查阅。</h1>
      <p class="intro">输入访问密码，在当前浏览器中解密监控页面。</p>
      <form id="unlock-form" autocomplete="off">
        <label for="password">访问密码</label>
        <div class="password-field">
          <input id="password" name="password" type="password" required maxlength="256" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="请输入访问密码" aria-describedby="status" autofocus>
          <button id="show-password" class="reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
        <button id="unlock-button" class="primary" type="submit"><span>解锁页面</span><span aria-hidden="true">↗</span></button>
        <p id="status" class="status" aria-live="polite" role="status"></p>
      </form>
      <div class="privacy-note">
        <span class="privacy-dot" aria-hidden="true"></span>
        <p>密码不会上传，也不会保存在浏览器中。刷新或锁定后，需要重新输入。</p>
      </div>
      <p class="method-note">此页面采用浏览器端加密，不是服务器账户登录或设备身份认证。</p>
    </section>
    <footer class="gate-footer">PRIVATE WORKSPACE <span>·</span> AES-256-GCM</footer>
  </main>
  <section id="workspace" class="workspace" hidden aria-label="已解密的研究监控">
    <header class="workspace-bar"><span><i aria-hidden="true"></i>研究监控 <small>当前会话已解锁</small></span><button id="lock-button" type="button">锁定并退出</button></header>
    <iframe id="dashboard" title="研究监控内容" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </section>
</body>
</html>
